<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout | SISSY'S LUXURY</title>
  <meta name="description" content="Complete your order with SISSY'S LUXURY. Secure checkout for luxury fashion.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SISSY'S LUXURY">
  <meta property="og:title" content="Secure Checkout — SISSY'S LUXURY">
  <meta property="og:description" content="Complete your order with SISSY'S LUXURY. Secure checkout for luxury fashion.">
  <meta property="og:url" content="https://wig-blush.vercel.app/checkout">
  <meta property="og:image" content="https://wig-blush.vercel.app/assets/images/hero-main.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages/checkout.css">
</head>
<body>

  <!-- Shared layout: announcement bar, navigation, mobile menu -->
  <div data-site-layout="top"></div>

  <main class="main-content-with-bar">
    <div class="container">

      <div class="breadcrumbs">
        <a href="index.html">Home</a>
        <span class="separator">›</span>
        <span>Checkout</span>
      </div>

      <h1 class="checkout-title">Secure Checkout</h1>

      <div class="checkout-layout">
        <!-- Form -->
        <div class="checkout-form">

          <!-- Contact -->
          <div class="checkout-section">
            <h2 class="checkout-section-title">Contact Information</h2>
            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <input type="email" id="email" class="form-input" placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 000-0000">
            </div>
          </div>

          <!-- Shipping -->
          <div class="checkout-section">
            <h2 class="checkout-section-title">Shipping Address</h2>
            <div class="checkout-row">
              <div class="form-group">
                <label class="form-label" for="first-name">First Name</label>
                <input type="text" id="first-name" class="form-input" placeholder="First name">
              </div>
              <div class="form-group">
                <label class="form-label" for="last-name">Last Name</label>
                <input type="text" id="last-name" class="form-input" placeholder="Last name">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="address">Address</label>
              <input type="text" id="address" class="form-input" placeholder="Street address">
            </div>
            <div class="checkout-row">
              <div class="form-group">
                <label class="form-label" for="city">City</label>
                <input type="text" id="city" class="form-input" placeholder="City">
              </div>
              <div class="form-group">
                <label class="form-label" for="state">State</label>
                <input type="text" id="state" class="form-input" placeholder="State">
              </div>
            </div>
            <div class="checkout-row">
              <div class="form-group">
                <label class="form-label" for="zip">Zip Code</label>
                <input type="text" id="zip" class="form-input" placeholder="00000">
              </div>
              <div class="form-group">
                <label class="form-label" for="country">Country</label>
                <input type="text" id="country" class="form-input" placeholder="United States" value="United States">
              </div>
            </div>
          </div>

          <!-- Payment -->
          <div class="checkout-section">
            <h2 class="checkout-section-title">Payment Method</h2>
            <div class="form-group">
              <label class="form-label" for="card-number">Card Number</label>
              <input type="text" id="card-number" class="form-input" placeholder="0000 0000 0000 0000">
            </div>
            <div class="checkout-row">
              <div class="form-group">
                <label class="form-label" for="expiry">Expiry Date</label>
                <input type="text" id="expiry" class="form-input" placeholder="MM / YY">
              </div>
              <div class="form-group">
                <label class="form-label" for="cvv">CVV</label>
                <input type="text" id="cvv" class="form-input" placeholder="000">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="card-name">Name on Card</label>
              <input type="text" id="card-name" class="form-input" placeholder="Full name as shown on card">
            </div>
          </div>

          <button class="btn btn-primary btn-lg" style="width:100%;" id="place-order-btn">Place Order</button>

          <p style="text-align:center;margin-top:var(--space-md);font-size:12px;color:var(--color-grey-dark);">
            Your payment information is encrypted and secure. By placing your order, you agree to our Terms of Service and Privacy Policy.
          </p>
        </div>

        <!-- Order Summary -->
        <div class="order-summary" id="order-summary">
          <h2 class="order-summary-title">Order Summary</h2>
          <div id="order-items"></div>
          <div class="order-totals">
            <div class="order-total-row">
              <span>Subtotal</span><span id="order-subtotal">$0.00</span>
            </div>
            <div class="order-total-row">
              <span>Shipping</span><span id="order-shipping">—</span>
            </div>
            <div class="order-total-row">
              <span>Tax</span><span id="order-tax">—</span>
            </div>
            <div class="order-total-row grand">
              <span>Total</span><span id="order-total">$0.00</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Shared layout: minimal footer -->
  <div data-site-layout="footer-minimal"></div>

  <!-- Shared layout: cart drawer -->
  <div data-site-layout="cart"></div>

  <script src="assets/js/site.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
