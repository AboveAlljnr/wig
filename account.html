<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | SISSY'S LUXURY</title>
  <meta name="description" content="Sign in or create an account at SISSY'S LUXURY.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SISSY'S LUXURY">
  <meta property="og:title" content="My Account — SISSY'S LUXURY">
  <meta property="og:description" content="Sign in or create an account at SISSY'S LUXURY.">
  <meta property="og:url" content="https://wig-blush.vercel.app/account">
  <meta property="og:image" content="https://wig-blush.vercel.app/assets/images/hero-main.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/pages/account.css">
</head>
<body>

  <!-- Shared layout: announcement bar, navigation, mobile menu -->
  <div data-site-layout="top"></div>

  <main class="main-content-with-bar">
    <div class="container">
      <div class="account-layout">

        <!-- Header -->
        <div class="account-header animate-fade-in-up">
          <h1 class="account-title">My Account</h1>
          <p class="account-subtitle">Sign in to your account or create one to manage orders and preferences.</p>
        </div>

        <!-- Logged-in View (hidden by default) -->
        <div class="account-logged-in animate-fade-in-up" id="account-logged-in" style="display:none;">
          <div class="account-logged-in-icon" id="account-initials">S</div>
          <div class="account-logged-in-name" id="account-display-name"></div>
          <div class="account-logged-in-email" id="account-display-email"></div>
          <a href="collection.html" class="btn btn-primary" style="margin-bottom:var(--space-sm);">Continue Shopping</a>
          <button class="btn-ghost" id="account-logout-btn" style="display:block;margin:var(--space-sm) auto 0;">Sign Out</button>
        </div>

        <!-- Login / Signup Forms -->
        <div id="account-forms" class="animate-fade-in-up">

          <!-- Tabs -->
          <div class="account-tabs">
            <button class="account-tab active" data-tab="login">Sign In</button>
            <button class="account-tab" data-tab="signup">Create Account</button>
          </div>

          <!-- Login Form -->
          <form class="account-form active" id="login-form" autocomplete="on">
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input type="email" id="login-email" class="form-input" placeholder="your@email.com" autocomplete="email" required>
              <div class="account-error" id="login-email-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <input type="password" id="login-password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
              <div class="account-error" id="login-password-error"></div>
            </div>
            <a href="#" class="account-forgot">Forgot password?</a>
            <div class="account-error" id="login-general-error" style="margin-top:var(--space-sm);"></div>
            <button type="submit" class="btn btn-primary account-submit">Sign In</button>
          </form>

          <!-- Signup Form -->
          <form class="account-form" id="signup-form" autocomplete="on">
            <div class="form-group">
              <label class="form-label" for="signup-name">Full Name</label>
              <input type="text" id="signup-name" class="form-input" placeholder="Jane Doe" autocomplete="name" required>
              <div class="account-error" id="signup-name-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-email">Email Address</label>
              <input type="email" id="signup-email" class="form-input" placeholder="your@email.com" autocomplete="email" required>
              <div class="account-error" id="signup-email-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-password">Password</label>
              <input type="password" id="signup-password" class="form-input" placeholder="Create a password" autocomplete="new-password" required>
              <div class="account-error" id="signup-password-error"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-confirm">Confirm Password</label>
              <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm your password" autocomplete="new-password" required>
              <div class="account-error" id="signup-confirm-error"></div>
            </div>
            <div class="account-error" id="signup-general-error" style="margin-top:var(--space-sm);"></div>
            <button type="submit" class="btn btn-primary account-submit">Create Account</button>
          </form>

          <!-- Divider -->
          <div class="account-divider">or</div>
          <a href="collection.html" class="account-guest">Continue as Guest</a>

        </div>
      </div>
    </div>
  </main>

  <!-- Shared layout: footer -->
  <div data-site-layout="footer"></div>

  <!-- Shared layout: cart drawer -->
  <div data-site-layout="cart"></div>

  <script src="assets/js/site.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // ── Logged-in state ─────────────────────────────────────
    function renderLoggedInState() {
      const user = window.SissyAuth && window.SissyAuth.getUser();
      const loggedIn = document.getElementById('account-logged-in');
      const forms = document.getElementById('account-forms');
      if (!loggedIn || !forms) return;
      if (user) {
        loggedIn.style.display = 'block';
        forms.style.display = 'none';
        const initials = user.name.split(/\s+/).filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join('') || 'S';
        document.getElementById('account-initials').textContent = initials;
        document.getElementById('account-display-name').textContent = user.name;
        document.getElementById('account-display-email').textContent = user.email;
      } else {
        loggedIn.style.display = 'none';
        forms.style.display = 'block';
      }
    }

    // ── Tab Toggle ──────────────────────────────────────────
    document.querySelectorAll('.account-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.account-form').forEach(f => f.classList.remove('active'));
        document.getElementById(tab.dataset.tab + '-form').classList.add('active');
        document.querySelectorAll('.account-error').forEach(e => e.style.display = 'none');
      });
    });

    // ── Login Handler ──────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.querySelectorAll('.account-error').forEach(e => e.style.display = 'none');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email) { showError('login-email-error', 'Email is required'); return; }
      if (!password) { showError('login-password-error', 'Password is required'); return; }
      const result = window.SissyAuth.login(email, password);
      if (result.success) { window.location.href = 'collection.html'; }
      else { showError('login-general-error', result.message); }
    });

    // ── Signup Handler ─────────────────────────────────────
    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.querySelectorAll('.account-error').forEach(e => e.style.display = 'none');
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (!name) { showError('signup-name-error', 'Full name is required'); return; }
      if (!email) { showError('signup-email-error', 'Email is required'); return; }
      if (!password) { showError('signup-password-error', 'Password is required'); return; }
      if (password.length < 6) { showError('signup-password-error', 'Password must be at least 6 characters'); return; }
      if (password !== confirm) { showError('signup-confirm-error', 'Passwords do not match'); return; }
      const result = window.SissyAuth.register(name, email, password);
      if (result.success) { window.location.href = 'collection.html'; }
      else { showError('signup-general-error', result.message); }
    });

    // ── Logout Handler ─────────────────────────────────────
    document.getElementById('account-logout-btn')?.addEventListener('click', () => {
      window.SissyAuth.logout();
      location.reload();
    });

    function showError(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }

    renderLoggedInState();
  </script>
</body>
</html>
